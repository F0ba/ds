name: build-exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pystray pillow pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --hidden-import pystray._win32 --name server server.py

      - uses: actions/upload-artifact@v4
        with:
          name: server-exe
          path: dist/server.exe
